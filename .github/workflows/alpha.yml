name: A-Share Alpha Radar
on:
  workflow_dispatch:
  schedule:
    # 任务1: 新加坡时间 07:00 盘前选股 (UTC 23:00 前一天)
    - cron: '0 23 * * 0-4'
    # 任务2: 新加坡时间 16:00 盘后复盘 (UTC 08:00)
    - cron: '0 8 * * 1-5'

jobs:
  run-quant:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Libs
      run: pip install pandas tushare requests anthropic

    - name: ⏱️ Run Script Based on Time (智能分流)
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
        CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
        EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
      run: |
        CURRENT_HOUR=$(date +'%H')
        if [ "$CURRENT_HOUR" -ge 0 ] && [ "$CURRENT_HOUR" -le 23 ]; then
          echo "🌅 强制触发【盘前选股】引擎..."
          python scan.py
        fi

    - name: 💾 Save Logs & Sync to GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Alpha Bot"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto update A-share logs"
        git push
