name: A-Share Alpha Radar

on:
  workflow_dispatch:
  schedule:
    # 任务1: A股盘前选股 (北京时间 09:00，UTC 01:00)
    - cron: '0 1 * * 1-5'
    # 任务2: A股盘后复盘 (北京时间 16:00，UTC 08:00)
    - cron: '0 8 * * 1-5'

jobs:
  run-quant:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Libs
      run: pip install pandas tushare requests google-genai

    - name: ⏱️ Run Script Based on Time (智能分流)
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
      run: |
        CURRENT_HOUR=$(date +'%H')
        # 如果是 UTC 时间 0点~4点 之间 (北京时间早上)，跑选股！
        if [ "$CURRENT_HOUR" -ge 0 ] && [ "$CURRENT_HOUR" -le 4 ]; then
          echo "🌅 触发【盘前选股】引擎 (北京时间 09:00)..."
          python scan.py
        # 其他时间跑复盘！
        else
          echo "🌙 触发【盘后复盘】引擎 (北京时间 16:00)..."
          python review.py || true
        fi

    - name: 💾 Save Logs & Sync to GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "Alpha Bot"
        git add -A
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto update A-share logs"
        git push
