name: A股盘后复盘

on:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 拉取最新代码
        run: git pull origin main --ff-only

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pandas tushare anthropic requests yfinance

      - name: 配置Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: 运行A股盘后复盘
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
        run: python review.py

      - name: 提交账本和处理记录
        run: |
          git add trade_history.csv review_history.csv
          
          if ls ashare_stocks_pending_*.csv.processed 1> /dev/null 2>&1; then
            git add ashare_stocks_pending_*.csv.processed
          fi
          
          git rm -f ashare_stocks_pending_*.csv 2>/dev/null || true
          
          git commit -m "chore: A股盘后补充成交 $(date +%Y-%m-%d)" || echo "无变更"
          git push
          echo "✅ A股成交记录已提交"
