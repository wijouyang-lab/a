name: A股盘后复盘

on:
  schedule:
    - cron: '30 07 * * 1-5'  # ✨ 添加了定时运行（北京时间15:30）
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 拉取最新代码
        run: git pull origin main --ff-only  # ✨ 添加：获取最新待确认文件

      - name: 设置Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: pip install pandas tushare anthropic requests

      - name: 配置Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: 运行A股盘后复盘
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python review__1_.py

      - name: 提交账本和处理记录
        run: |
          # ✨ 改动：精确提交，避免混乱
          git add trade_history.csv review_history.csv
          
          # 提交已处理的备份
          if ls ashare_stocks_pending_*.csv.processed 1> /dev/null 2>&1; then
            git add ashare_stocks_pending_*.csv.processed
          fi
          
          # 删除待确认文件（已处理）
          git rm -f ashare_stocks_pending_*.csv 2>/dev/null || true
          
          # 提交
          git commit -m "chore: A股盘后补充成交 $(date +%Y-%m-%d)" || echo "无变更"
          git push
          echo "✅ A股成交记录已提交"

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: review-logs
          path: |
            review_report.html
            *.log
