name: A股盘前扫描

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pandas tushare anthropic requests

      - name: 配置Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: 运行A股盘前扫描
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
        run: python scan.py

      - name: 提交待确认文件
        run: |
          if ls ashare_stocks_pending_*.csv 1> /dev/null 2>&1; then
            git add ashare_stocks_pending_*.csv
            git commit -m "chore: A股盘前待确认 $(date +%Y-%m-%d)"
            git push
            echo "✅ A股待确认文件已提交"
          else
            echo "⚠️ 未生成A股待确认文件"
          fi
