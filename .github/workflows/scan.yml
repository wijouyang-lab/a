name: A股盘前扫描

on:
  workflow_dispatch:

concurrency:
  group: ashare-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pandas tushare anthropic requests yfinance

      - name: 配置Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: 运行A股盘前扫描
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
        run: python scan.py

      - name: 提交待确认文件
        shell: bash
        run: |
          set -euo pipefail

          # 1. 暂存所有可能被修改的文件
          for f in trade_history.csv review_history.csv forced_exit_log.csv scan_version.txt ashare_stocks_pending_*.csv; do
            [ -f "$f" ] && git add "$f" || true
          done

          # 2. 【关键修复】Python 可能已物理删除 git 跟踪的文件，显式暂存删除
          git ls-files --deleted | grep -E '^(ashare_stocks_pending_.*\.csv(\.processed)?|trade_history\.csv|review_history\.csv)$' | xargs -r git rm -f || true

          if git diff --cached --quiet; then
            echo "ℹ️ 没有新的待确认文件变更"
            exit 0
          fi

          git commit -m "chore: A股盘前待确认 $(date +%Y-%m-%d)"

          # scan 运行期间如果远程 main 有新提交，先同步再推送。
          for attempt in 1 2 3; do
            echo "🔄 同步远程 main，第 ${attempt}/3 次..."
            git fetch origin main

            if ! git rebase origin/main; then
              echo "❌ rebase 冲突：远程 main 与本次扫描产生了无法自动合并的修改。"
              echo "为避免覆盖其他 workflow 的提交，停止本次 push。"
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "✅ A股待确认文件已提交"
              exit 0
            fi

            echo "⚠️ push 被远程更新拒绝，重新 fetch/rebase..."
            sleep $((attempt * 2))
          done

          echo "❌ 连续 3 次 push 失败"
          exit 1
