name: A股盘前扫描

on:
  workflow_dispatch:

# scan / review 都会修改 main 下的 CSV。
# 使用同一 concurrency group，避免两个工作流同时抢占 main。
concurrency:
  group: ashare-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pandas tushare anthropic requests yfinance

      - name: 配置Git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: 运行A股盘前扫描
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          TARGET_EMAILS: ${{ secrets.TARGET_EMAILS }}
          EMAIL_ACCOUNT: ${{ secrets.EMAIL_ACCOUNT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          CLAWSOCKET_API_KEY: ${{ secrets.CLAWSOCKET_API_KEY }}
          CLAWSOCKET_BASE_URL: ${{ secrets.CLAWSOCKET_BASE_URL }}
        run: python scan.py

      - name: 提交待确认文件
        shell: bash
        run: |
          set -euo pipefail

          if ! ls ashare_stocks_pending_*.csv 1> /dev/null 2>&1; then
            echo "⚠️ 未生成A股待确认文件"
            exit 0
          fi

          git add ashare_stocks_pending_*.csv
          git diff --cached --quiet && {
            echo "ℹ️ 没有新的待确认文件变更"
            exit 0
          }

          git commit -m "chore: A股盘前待确认 $(date +%Y-%m-%d)"

          # scan 运行期间如果远程 main 有新提交，先同步再推送。
          # 最多重试 3 次；绝不 force push。
          for attempt in 1 2 3; do
            echo "🔄 同步远程 main，第 ${attempt}/3 次..."
            git fetch origin main

            if ! git rebase origin/main; then
              echo "❌ rebase 冲突：远程 main 与本次扫描产生了无法自动合并的修改。"
              echo "为避免覆盖其他 workflow 的提交，停止本次 push。"
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "✅ A股待确认文件已提交"
              exit 0
            fi

            echo "⚠️ push 被远程更新拒绝，重新 fetch/rebase..."
            sleep $((attempt * 2))
          done

          echo "❌ 连续 3 次 push 失败"
          exit 1
